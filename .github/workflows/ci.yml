name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run lint
      - run: mise run fmt-check
      # the token lets zizmor run its online audits (impostor commits, known vulnerable actions)
      - run: mise run lint-actions
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
          - name: macos-latest
            os: macos-latest
          # The lowest supported bash. docker run keeps JavaScript actions out of the Alpine
          # based image.
          - name: bash 4.4
            os: ubuntu-latest
            image: bash:4.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # macOS ships bash 3.2; uptools needs >= 4.4
      - name: Install a current bash
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install bash
      - name: Run the tests
        if: ${{ !matrix.image }}
        run: |
          bash --version
          bash tests/smoke.sh
      - name: Run the tests in a container
        if: ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD":/w:ro -w /w "$IMAGE" bash tests/smoke.sh

  # The single required status check. It reports for every PR (no path filters on the workflow)
  # and does not depend on job names, so jobs can be added or renamed without touching the ruleset.
  ci:
    name: CI
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job finished with: $result" >&2
              exit 1
            fi
          done
